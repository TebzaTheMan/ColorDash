services:
  postgres:
    image: postgres:16
    container_name: colordash-postgres
    environment:
      POSTGRES_USER: colordash
      POSTGRES_PASSWORD: colordash
      POSTGRES_DB: colordash
    ports:
      - "5432:5432"
    volumes:
      - colordash-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U colordash -d colordash"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: mcr.microsoft.com/dotnet/sdk:10.0
    container_name: colordash-api
    working_dir: /src
    command: dotnet watch run --project ColorDash.Api.csproj --non-interactive --urls http://+:5043
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Host=postgres;Port=5432;Database=colordash;Username=colordash;Password=colordash"
      DOTNET_USE_POLLING_FILE_WATCHER: "true"
    volumes:
      - ./api:/src
      - api-nuget:/root/.nuget/packages
      - /src/bin
      - /src/obj
    ports:
      - "5043:5043"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: node:20-alpine
    container_name: colordash-web
    working_dir: /app
    command: sh -c "[ -f node_modules/.package-lock.json ] || npm ci; npm run dev -- --hostname 0.0.0.0"
    environment:
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./web:/app
      - web-node-modules:/app/node_modules
      - /app/.next
    ports:
      - "3000:3000"

volumes:
  colordash-pgdata:
  api-nuget:
  web-node-modules:
